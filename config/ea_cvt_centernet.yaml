name: onnx_centernet
work_dir: ./exp/cvt_centernet
model_path: ./models/ctdet_coco_dla_2x_conv.onnx

data_prepare:
  dra_data_1:
    in_path: ./dra_img/
    in_file_ext: jpg
    out_shape: 1,3,512,512
    out_data_format: uint8
    transforms:
      - class: GenImageList
        arguments:
          color: BGR

input_nodes:
  input:
    data_prepare: dra_data_1

output_nodes:
  output:
    data_format: fp16
  '569':
    data_format: fp16
  '572':
    data_format: fp16

cnngen_convert:
  dra_option:
    strategy: auto
